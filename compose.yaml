# Life Hub on a private LAN / Tailscale host. Copy .env.example to .env first.
# PORT (3000) serves the web app and /api/v1 without login: never expose it publicly.
# MCP_PORT (3001) serves /mcp for the agent VM; restrict who can reach which port
# with Tailscale ACLs, the Proxmox firewall or DOCKER-USER (published Docker ports bypass ufw).
services:
  life-hub:
    build: .
    image: life-hub:local
    restart: unless-stopped
    env_file: .env
    ports:
      # Host port = container port, both taken from PORT / MCP_PORT in .env.
      - "${LIFE_HUB_BIND:-0.0.0.0}:${PORT:-3000}:${PORT:-3000}"
      - "${MCP_BIND:-0.0.0.0}:${MCP_PORT:-3001}:${MCP_PORT:-3001}"
    volumes:
      - life-hub-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  life-hub-data:
